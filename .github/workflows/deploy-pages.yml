name: Deploy to GitHub Pages

# Builds the Vue app and publishes the static output in dist/.
#
# The legacy Express + SQLite backend in server/ is never published: it is not
# part of the build, so nothing here has to actively exclude it. Only what
# vite-ssg emits reaches the artifact.
#
# There is deliberately no actions/configure-pages step. The site uses
# base: "./" — every asset reference is relative — so there is no repository
# sub-path to inject, and configure-pages is the step that tries to call the
# Pages API, which is where the "Resource not accessible by integration" error
# came from. Skipping it removes both the permission problem and an API call
# whose result the build does not use.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Nothing in the output is named _site or starts with _, so Jekyll would
      # leave it alone anyway — this is insurance, not a requirement.
      - name: Keep Jekyll out of the output
        run: touch dist/.nojekyll

      - name: Show what gets published
        run: find dist -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
