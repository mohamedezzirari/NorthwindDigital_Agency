name: Deploy to GitHub Pages

# Builds the Vue app, runs the assertion suite against the build, then publishes
# dist/. Nothing but vite-ssg's own output reaches the artifact, so there is no
# step that has to actively exclude anything.
#
# There is deliberately no actions/configure-pages step. The site uses
# base: "./" — every asset reference is relative — so there is no repository
# sub-path to inject, and configure-pages is the step that tries to call the
# Pages API, which is where the "Resource not accessible by integration" error
# came from. Skipping it removes both the permission problem and an API call
# whose result the build does not use.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The suites assert against dist/ rather than against the sources, so they
      # have to run after the build. A failure here stops the deploy — the point
      # is that a broken page never reaches the live URL.
      - name: Test the built page
        run: npm test

      # Separated from npm test because it checks a binary asset rather than the
      # markup, and a bad og:image fails silently in the wild: the post still
      # renders, just with no preview card.
      - name: Check the social card
        run: npm run og:check

      # Nothing in the output is named _site or starts with _, so Jekyll would
      # leave it alone anyway — this is insurance, not a requirement.
      - name: Keep Jekyll out of the output
        run: touch dist/.nojekyll

      - name: Show what gets published
        run: find dist -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
