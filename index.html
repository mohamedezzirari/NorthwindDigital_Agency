<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Northwind Digital | Web Development &amp; Digital Marketing Agency</title>
  <meta name="description"
    content="Websites, web apps and marketing campaigns built by one team, so your business gets found and grows.">
  <meta name="theme-color" content="#14173D">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <!--
    Social preview. og:image is deliberately missing: it must be an ABSOLUTE url
    to work, and there is no canonical domain yet. It is added at Checkpoint 3
    once the final host is known.
  -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Northwind Digital — Build it. Launch it. Grow it.">
  <meta property="og:description"
    content="Websites, web apps and marketing campaigns built by one team, so your business gets found and grows.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!--
    Structured data. The email mirrors the placeholder in src/data/content.js;
    keep the two in step until real contact details replace them.
    No "logo" field yet: schema.org expects an ABSOLUTE url there, and there is
    no canonical domain. It is added at Checkpoint 3 along with og:image.
  -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Northwind Digital",
      "email": "hello@example.com"
    }
  </script>
</head>

<body>
  <!--
    vite-ssg locates this element by its id and replaces it wholesale with the
    pre-rendered markup at build time, so the build output contains the real
    page rather than an empty shell. Do not rename the id.
  -->
  <div id="app"></div>

  <!--
    The page content IS present without JavaScript because it is pre-rendered.
    Only the interactive parts (menu, carousel, billing toggle, promo code,
    form) need it. This notice is hidden whenever JS runs.
  -->
  <noscript>
    <p style="padding:24px;font:16px/1.6 system-ui,sans-serif">
      Some interactive parts of this page need JavaScript. You can still reach us at
      <a href="mailto:hello@example.com">hello@example.com</a>.
    </p>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
